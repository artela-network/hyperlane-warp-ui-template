# A map of chain names to ChainMetadata
# Chains can be defined here, in chains.json, or in chains.ts
# Chains already in the SDK need not be included here unless you want to override some fields
# Schema here: https://github.com/hyperlane-xyz/hyperlane-monorepo/blob/main/typescript/sdk/src/metadata/chainMetadataTypes.ts
---
# Example using local anvil chain:
# anvil1:
#   chainId: 31337
#   domainId: 31337
#   name: anvil1
#   protocol: ethereum
#   rpcUrls:
#     - http: http://127.0.0.1:8545
# anvil2:
#   chainId: 31338
#   domainId: 31338
#   name: anvil2
#   protocol: ethereum
#   rpcUrls:
#     - http: http://127.0.0.1:8555
artela:
  blockExplorers:
    - apiUrl: https://artscan.artela.network/api
      family: blockscout
      name: Artela Explorer
      url: https://artscan.artela.network
  blocks:
    confirmations: 1
    estimateBlockTime: 2
    reorgPeriod: 5
  chainId: 11820
  deployer:
    name: Abacus Works
    url: https://www.hyperlane.xyz
  displayName: Artela
  domainId: 11820
  gasCurrencyCoinGeckoId: artela
  name: artela
  nativeToken:
    decimals: 18
    name: Artela
    symbol: ART
  protocol: ethereum
  rpcUrls:
    - http: https://node-euro.artela.network/rpc
    - http: https://node-hongkong.artela.network/rpc
  technicalStack: other